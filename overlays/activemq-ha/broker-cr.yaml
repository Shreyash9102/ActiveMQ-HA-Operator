apiVersion: broker.amq.io/v1beta1
kind: ActiveMQArtemis
metadata:
  name: artemis-broker
  namespace: activemq-artemis-operator
spec:
  deploymentPlan:
    size: 2
    persistenceEnabled: true
    messageMigration: true
    storage:
      size: 2Gi
      storageClassName: standard
  # Add environment variable override
  env:
    - name: AMQ_DATA_DIR
      value: "/home/jboss/amq-broker/data"
  acceptors:
    - name: amqp
      protocols: amqp
      port: 5672
    - name: all
      protocols: all
      port: 61616



