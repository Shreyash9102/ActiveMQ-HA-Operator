apiVersion: v1
kind: Secret
metadata:
  name: artemis-broker-credentials
  namespace: activemq-artemis-operator
type: Opaque
stringData:
  # Admin user - for web console and full access
  admin-username: "shreyash-admin"
  admin-password: "YourSecureAdminPassword@2025"
  
  # Application user - for application connections
  app-username: "artemis-app"
  app-password: "YourAppPassword@2025"
  
  # Monitoring user - read-only
  monitor-username: "monitor"
  monitor-password: "MonitorPassword@2025"

---
# SecurityConfiguration for Artemis
apiVersion: broker.amq.io/v1beta1
kind: ActiveMQArtemisSecurity
metadata:
  name: artemis-broker-security
  namespace: activemq-artemis-operator
spec:
  loginModules:
    - name: "PropertiesLogin"
      moduleType: "properties"
      users:
        - username: "shreyash-admin"
          password: "YourSecureAdminPassword@2025"
          roles:
            - "admin"
            - "user"
        - username: "artemis-app"
          password: "YourAppPassword@2025"
          roles:
            - "user"
        - username: "monitor"
          password: "MonitorPassword@2025"
          roles:
            - "monitor"
            - "view"
